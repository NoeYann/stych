<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Stych Suivi</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    width: 220px;
    padding: 16px;
    margin: 0;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 12px;
  }
  button {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: #4a90d9;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #3a7cc0;
  }
  p.hint {
    font-size: 11px;
    color: #666;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
  <h1>Stych Suivi</h1>
  <button id="open-results" type="button">Voir mes résultats</button>
  <p class="hint">Ouvre le tableau de résultats et de confiance dans un nouvel onglet.</p>
  <script src="popup.js"></script>
</body>
</html>
