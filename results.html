<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Résultats — Stych Suivi</title>
<link rel="stylesheet" href="results.css">
</head>
<body>
  <header>
    <h1>Mes résultats</h1>
    <div class="exam-picker" id="exam-picker">
      <button type="button" id="exam-picker-toggle" class="exam-picker-toggle" aria-haspopup="listbox" aria-expanded="false">
        <span class="exam-picker-toggle-text">—</span>
        <span class="exam-picker-caret" aria-hidden="true">▾</span>
      </button>
      <ul id="exam-picker-list" class="exam-picker-list" role="listbox" hidden></ul>
    </div>
    <div id="score" class="score">—</div>
    <div id="avg-confidence" class="avg-confidence-stat">—</div>
    <label class="filter-toggle">
      <input type="checkbox" id="filter-missed">
      Questions loupées
    </label>
    <label class="filter-toggle">
      <input type="checkbox" id="filter-low-confidence">
      Confiance faible (1-2)
    </label>
    <button id="download-csv" type="button">Télécharger en CSV</button>
  </header>
  <main>
    <table id="results-table">
      <thead>
        <tr>
          <th>N°</th>
          <th>Confiance</th>
          <th>Question</th>
          <th>Ta réponse</th>
          <th>Bonne réponse</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <p id="empty-state" class="empty-state">
      Aucun résultat trouvé. Termine un examen blanc puis reviens sur cette page.
    </p>
  </main>
  <script src="results.js"></script>
</body>
</html>
